# ==============================================================================
# Eclipse Mosquitto Configuration
# ==============================================================================
# Listeners, device logins and the external-broker bridge depend on .env, so
# bridge.sh generates them into /mosquitto/conf.d at container start (see
# the include at the end, and the variables at the top of bridge.sh).

# ------------------------------------------------------------------------------
# Persistence
# ------------------------------------------------------------------------------

persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------

# stdout only: `docker logs p4n4-mqtt` shows it, and Docker can rotate it.
# Mosquitto never rotates its own log file, which grew until the disk was full.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ------------------------------------------------------------------------------
# Listeners, logins and bridge (generated)
# ------------------------------------------------------------------------------

# Files load in alphabetical order: 10-listeners.conf, then 90-bridge.conf.
# Keep this last: every option after a bridge's "connection" line belongs to
# that bridge.
include_dir /mosquitto/conf.d
