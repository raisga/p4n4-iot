# ==============================================================================
# Eclipse Mosquitto Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# Listeners
# ------------------------------------------------------------------------------

# MQTT protocol listener
listener 1883
protocol mqtt

# WebSocket listener (for browser-based clients)
listener 9001
protocol websockets

# ------------------------------------------------------------------------------
# Security
# ------------------------------------------------------------------------------

# Allow anonymous connections (set to false for production)
allow_anonymous true

# For authenticated setup, uncomment and configure:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# ------------------------------------------------------------------------------
# Persistence
# ------------------------------------------------------------------------------

persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------

# stdout only: `docker logs p4n4-mqtt` shows it, and Docker can rotate it.
# Mosquitto never rotates its own log file, which grew until the disk was full.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ------------------------------------------------------------------------------
# Bridge to an external broker
# ------------------------------------------------------------------------------

# bridge.sh generates this directory's contents from the MQTT_REMOTE_* variables
# in .env at container start (empty when MQTT_REMOTE_HOST is unset). Keep this
# last: every option after a bridge's "connection" line belongs to that bridge.
include_dir /mosquitto/bridge
