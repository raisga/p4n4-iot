# ==============================================================================
# Telegraf: host and broker metrics → InfluxDB system_health bucket
# ==============================================================================
#
#   host /proc, /sys, filesystems ──► cpu, mem, disk, diskio, system ──┐
#   mqtt $SYS/broker/...          ──► mosquitto ───────────────────────┴──► InfluxDB
#
# Sensor data is not read here: Node-RED writes it to the raw_telemetry bucket.
# Host network counters are left out: Telegraf runs in the stack's network
# namespace, so it would only see its own container interface.
#
# ${VAR} values come from the container environment (see docker-compose.yml).
# ==============================================================================

[agent]
  interval = "${TELEGRAF_INTERVAL}"
  flush_interval = "10s"
  # No aggregators are used; set explicitly to silence the default-change warning
  skip_processors_after_aggregators = true

# ------------------------------------------------------------------------------
# Inputs: host (through the /hostfs mount; HOST_* env vars point there)
# ------------------------------------------------------------------------------

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.system]]

[[inputs.disk]]
  # Only the host's root filesystem; the container's own mounts are noise.
  # Paths are as seen on the host (HOST_MOUNT_PREFIX is stripped).
  mount_points = ["/"]

[[inputs.diskio]]

# ------------------------------------------------------------------------------
# Inputs: Mosquitto broker stats
# ------------------------------------------------------------------------------

# Numeric $SYS topics only; uptime and version are text. Mosquitto republishes
# them every 10s. The broker may be left out of the stack, so a failed
# connection at startup is retried instead of stopping Telegraf.
# "$$" keeps Telegraf from reading $SYS as an environment variable.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  topics = [
    "$$SYS/broker/clients/connected",
    "$$SYS/broker/clients/total",
    "$$SYS/broker/subscriptions/count",
    "$$SYS/broker/messages/received",
    "$$SYS/broker/messages/sent",
    "$$SYS/broker/messages/stored",
    "$$SYS/broker/bytes/received",
    "$$SYS/broker/bytes/sent",
    "$$SYS/broker/load/messages/received/1min",
    "$$SYS/broker/load/messages/sent/1min",
  ]
  client_id = "p4n4-telegraf"
  startup_error_behavior = "retry"
  topic_tag = "topic"
  name_override = "mosquitto"
  data_format = "value"
  data_type = "float"

# ------------------------------------------------------------------------------
# Outputs
# ------------------------------------------------------------------------------

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_HEALTH}"
