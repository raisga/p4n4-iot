# ==============================================================================
# Grafana Datasources Provisioning
# ==============================================================================
# Env vars (INFLUXDB_TOKEN, INFLUXDB_ORG) are injected by docker-compose.yml
# and expanded by Grafana at startup.
# ==============================================================================

apiVersion: 1

# Installs provisioned before the fixed UIDs have hash-based UIDs, which
# Grafana can't change in place. Delete them here so they're re-created.
deleteDatasources:
  - name: InfluxDB
    orgId: 1
  - name: InfluxDB-Processed
    orgId: 1
  - name: InfluxDB-AI-Events
    orgId: 1
  - name: InfluxDB-Health
    orgId: 1
  - name: InfluxDB-Sandbox
    orgId: 1

datasources:

  # Primary bucket — all inbound sensor readings (30d)
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: raw_telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: true
    editable: true

  # Downsampled / aggregated metrics (365d)
  - name: InfluxDB-Processed
    uid: influxdb-processed
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: processed_metrics
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: true

  # AI-generated annotations, anomaly flags, agent logs (infinite)
  - name: InfluxDB-AI-Events
    uid: influxdb-ai-events
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: ai_events
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: true

  # Stack component health metrics (7d)
  - name: InfluxDB-Health
    uid: influxdb-health
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: system_health
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: true

  # Sandbox for development/testing
  - name: InfluxDB-Sandbox
    uid: influxdb-sandbox
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: sandbox
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: true
