# ==============================================================================
# Grafana Datasources Provisioning
# ==============================================================================
# Env vars (INFLUXDB_TOKEN, INFLUXDB_ORG, INFLUXDB_BUCKET*) are injected by
# docker-compose.yml and expanded by Grafana at startup. Dashboard and alert
# queries read from v.defaultBucket, the bucket of the data source they use,
# so renaming a bucket in .env needs no change to them.
# ==============================================================================

apiVersion: 1

# Installs provisioned before the fixed UIDs have hash-based UIDs, which
# Grafana can't change in place. Delete them here so they're re-created.
deleteDatasources:
  - name: InfluxDB
    orgId: 1
  - name: InfluxDB-Processed
    orgId: 1
  - name: InfluxDB-AI-Events
    orgId: 1
  - name: InfluxDB-Health
    orgId: 1
  - name: InfluxDB-Sandbox
    orgId: 1

datasources:

  # Primary bucket — all inbound sensor readings (30d)
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: true
    editable: true

  # Hourly rollups of the primary bucket (365d)
  - name: InfluxDB-Processed
    uid: influxdb-processed
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET_PROCESSED
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: true

  # AI-generated annotations, anomaly flags, agent logs (infinite)
  - name: InfluxDB-AI-Events
    uid: influxdb-ai-events
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET_AI_EVENTS
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: true

  # Stack component health metrics (7d)
  - name: InfluxDB-Health
    uid: influxdb-health
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET_HEALTH
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: true

  # Sandbox for development/testing
  - name: InfluxDB-Sandbox
    uid: influxdb-sandbox
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_SANDBOX_BUCKET
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: true

  # Container logs (profiles "loki" and "alloy"). Without them, queries to
  # it fail and nothing else is affected.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
