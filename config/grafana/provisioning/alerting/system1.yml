# ==============================================================================
# System 1 drift alerts (p4n4-docs, decisions/system1.md §10.4)
# ==============================================================================
# One alert per set and question, from the decisions in ai_events. Each sends to the
# "p4n4 System 1 drift" contact point: n8n's System 1 Drift workflow, which publishes
# it on system1/drift/<set>. SYSTEM1_ALERT_TOKEN (iot .env, the same value as the
# ai stack's) authenticates the webhook. A drift alert is a warning to evaluate the
# set again, never an automatic change.
# ==============================================================================

apiVersion: 1
contactPoints:
- orgId: 1
  name: p4n4 System 1 drift
  receivers:
  - uid: p4n4-system1-drift
    type: webhook
    settings:
      url: http://p4n4-n8n:5678/webhook/system1-drift
      httpMethod: POST
      authorization_scheme: Bearer
      authorization_credentials: $SYSTEM1_ALERT_TOKEN
    disableResolveMessage: false
groups:
- orgId: 1
  name: system1-drift
  folder: System 1
  interval: 15m
  rules:
  - uid: p4n4-system1-abstention
    title: System 1 abstention rate doubled
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3024000
        to: 0
      datasourceUid: influxdb-ai-events
      model:
        refId: A
        query: "// One row per set and question: decisions (n) and abstentions (a) between start and stop\ncounts = (start, stop) => from(bucket: \"ai_events\")\n  |> range(start: start, stop: stop)\n  |> filter(fn: (r) => r._measurement == \"system1_decision\" and r._field == \"abstain\")\n  |> map(fn: (r) => ({set: r.set, question: r.question, a: if r._value then 1.0 else 0.0}))\n  |> group(columns: [\"set\", \"question\"])\n  |> reduce(identity: {n: 0.0, a: 0.0}, fn: (r, accumulator) => ({n: accumulator.n + 1.0, a: accumulator.a + r.a}))\n  |> filter(fn: (r) => r.n >= 30.0)\n\n// The abstention rate of the last 7 days over that of the 28 days before (at least 5 %)\njoin(tables: {r: counts(start: -7d, stop: now()), p: counts(start: -35d, stop: -7d)}, on: [\"set\", \"question\"])\n  |> map(fn: (r) => ({set: r.set, question: r.question,\n      _value: (r.a_r / r.n_r) / (if r.a_p / r.n_p > 0.05 then r.a_p / r.n_p else 0.05)}))\n  |> group(columns: [\"set\", \"question\"])\n  |> map(fn: (r)\
          \ => ({set: r.set, question: r.question, _value: float(v: r._value), _time: now()}))"
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ $labels.set }}.{{ $labels.question }}: the abstention rate of the last 7 days is {{ printf "%.1f" $values.B.Value }}x that of the 28 days before'
      description: Run p4n4 ai system1 eval with recent feedback. If the gates fail on recent data, raise the threshold or remove the set (system1.md §10.4).
      runbook_url: https://github.com/raisga/p4n4-docs/blob/main/decisions/system1.md#104-drift
    labels:
      p4n4: system1-drift
      signal: abstention
    isPaused: false
    notification_settings:
      receiver: p4n4 System 1 drift
  - uid: p4n4-system1-shares
    title: System 1 answer mix moved
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3024000
        to: 0
      datasourceUid: influxdb-ai-events
      model:
        refId: A
        query: |-
          // Each option's share of the answers (abstentions apart), in points, between start and stop
          shares = (start, stop, period) => {
            rows = from(bucket: "ai_events")
              |> range(start: start, stop: stop)
              |> filter(fn: (r) => r._measurement == "system1_decision" and r._field == "abstain")
              |> map(fn: (r) => ({set: r.set, question: r.question, choice: if r._value then "(abstained)" else r.choice, n: 1.0}))
            per = rows |> group(columns: ["set", "question", "choice"]) |> sum(column: "n") |> group(columns: ["set", "question"])
            all = rows |> group(columns: ["set", "question"]) |> sum(column: "n") |> rename(columns: {n: "total"})
              |> filter(fn: (r) => r.total >= 30.0)
            return join(tables: {a: per, b: all}, on: ["set", "question"])
              |> map(fn: (r) => ({set: r.set, question: r.question, choice: r.choice, period: period, share: 100.0 * r.n / r.total}))
          }
          // Sets and questions with at least 30 decisions in both periods: a new one has no mix to move from
          counted = (start, stop) => from(bucket: "ai_events")
            |> range(start: start, stop: stop)
            |> filter(fn: (r) => r._measurement == "system1_decision" and r._field == "abstain")
            |> group(columns: ["set", "question"])
            |> count()
            |> filter(fn: (r) => r._value >= 30)
            |> keep(columns: ["set", "question"])
          both = join(tables: {r: counted(start: -7d, stop: now()), p: counted(start: -35d, stop: -7d)}, on: ["set", "question"])
          // The largest move of any option's share, last 7 days against the 28 days before
          moves = union(tables: [shares(start: -7d, stop: now(), period: "recent"), shares(start: -35d, stop: -7d, period: "prior")])
            |> group(columns: ["set", "question", "choice"])
            |> pivot(rowKey: ["set", "question", "choice"], columnKey: ["period"], valueColumn: "share")
            |> filter(fn: (r) => exists r.recent or exists r.prior)
            |> map(fn: (r) => ({set: r.set, question: r.question,
                _value: if exists r.recent and exists r.prior then (if r.recent > r.prior then r.recent - r.prior else r.prior - r.recent)
                  else if exists r.recent then r.recent else r.prior}))
            |> group(columns: ["set", "question"])
            |> max()
          join(tables: {m: moves, b: both}, on: ["set", "question"])
            |> map(fn: (r) => ({set: r.set, question: r.question, _value: float(v: r._value), _time: now()}))
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 20
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ $labels.set }}.{{ $labels.question }}: an option''s share moved by {{ printf "%.0f" $values.B.Value }} points against the 28 days before'
      description: Run p4n4 ai system1 eval with recent feedback. If the gates fail on recent data, raise the threshold or remove the set (system1.md §10.4).
      runbook_url: https://github.com/raisga/p4n4-docs/blob/main/decisions/system1.md#104-drift
    labels:
      p4n4: system1-drift
      signal: shares
    isPaused: false
    notification_settings:
      receiver: p4n4 System 1 drift
  - uid: p4n4-system1-latency
    title: System 1 latency p95 over half the timeout
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3024000
        to: 0
      datasourceUid: influxdb-ai-events
      model:
        refId: A
        query: |-
          // Latency p95 of the last 7 days, as callers measured it
          rows = from(bucket: "ai_events")
            |> range(start: -7d)
            |> filter(fn: (r) => r._measurement == "system1_decision" and r._field == "latency_ms")
            |> map(fn: (r) => ({set: r.set, question: r.question, _time: r._time, _value: float(v: r._value)}))
            |> group(columns: ["set", "question"])
          // At least 30 decisions, as the other alerts ask: a few slow first requests are not a trend
          counted = rows |> count() |> filter(fn: (r) => r._value >= 30) |> keep(columns: ["set", "question"])
          p95 = rows
            |> quantile(q: 0.95, method: "exact_selector")
            |> keep(columns: ["set", "question", "_value"])
          join(tables: {q: p95, n: counted}, on: ["set", "question"])
            |> map(fn: (r) => ({set: r.set, question: r.question, _value: float(v: r._value), _time: now()}))
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 2500
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ $labels.set }}.{{ $labels.question }}: latency p95 {{ printf "%.0f" $values.B.Value }} ms over 7 days, more than half the callers'' 5 s timeout'
      description: Run p4n4 ai system1 eval with recent feedback. If the gates fail on recent data, raise the threshold or remove the set (system1.md §10.4).
      runbook_url: https://github.com/raisga/p4n4-docs/blob/main/decisions/system1.md#104-drift
    labels:
      p4n4: system1-drift
      signal: latency
    isPaused: false
    notification_settings:
      receiver: p4n4 System 1 drift
