# Every service is optional: each sits in a profile of its own name, and
# COMPOSE_PROFILES in .env lists the ones that start. The default is the MING
# stack (mqtt, influxdb, node-red, grafana); add telegraf to collect host and
# broker metrics. Node-RED needs mqtt and influxdb, Grafana needs influxdb.

# Images are pinned to a minor version: patch releases come in with
# `docker compose pull`, new features don't arrive unannounced.

services:

  # ====================================================================================
  # MING STACK
  # ====================================================================================

  # ------------------------------------------------------------------------------------
  # MQTT Broker (Eclipse Mosquitto)
  # ------------------------------------------------------------------------------------
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: p4n4-mqtt
    profiles: [mqtt]
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "1883:1883"   # MQTT TCP
      - "9001:9001"   # MQTT WebSocket
    # bridge.sh writes the external-broker bridge config from MQTT_REMOTE_*
    # (a no-op when MQTT_REMOTE_HOST is empty), then runs the image entrypoint
    entrypoint: ["/bin/sh", "/p4n4/bridge.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_REMOTE_HOST: ${MQTT_REMOTE_HOST:-}
      MQTT_REMOTE_PORT: ${MQTT_REMOTE_PORT:-}
      MQTT_REMOTE_USER: ${MQTT_REMOTE_USER:-}
      MQTT_REMOTE_PASSWORD: ${MQTT_REMOTE_PASSWORD:-}
      MQTT_REMOTE_TOPICS: ${MQTT_REMOTE_TOPICS:-sensors/#}
      MQTT_REMOTE_PREFIX: ${MQTT_REMOTE_PREFIX:-}
      MQTT_REMOTE_QOS: ${MQTT_REMOTE_QOS:-0}
      MQTT_REMOTE_CLIENT_ID: ${MQTT_REMOTE_CLIENT_ID:-}
      MQTT_REMOTE_TLS: ${MQTT_REMOTE_TLS:-false}
      MQTT_REMOTE_CA_FILE: ${MQTT_REMOTE_CA_FILE:-}
      MQTT_REMOTE_CERT_FILE: ${MQTT_REMOTE_CERT_FILE:-}
      MQTT_REMOTE_KEY_FILE: ${MQTT_REMOTE_KEY_FILE:-}
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/bridge.sh:/p4n4/bridge.sh:ro
      - ./config/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Time-Series Database (InfluxDB)
  # ------------------------------------------------------------------------------------
  influxdb:
    image: influxdb:2.9
    container_name: p4n4-influxdb
    profiles: [influxdb]
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-ming}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RAW_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      # Additional bucket names (created by init-buckets.sh)
      INFLUXDB_BUCKET_PROCESSED: ${INFLUXDB_BUCKET_PROCESSED:-processed_metrics}
      INFLUXDB_BUCKET_AI_EVENTS: ${INFLUXDB_BUCKET_AI_EVENTS:-ai_events}
      INFLUXDB_BUCKET_HEALTH: ${INFLUXDB_BUCKET_HEALTH:-system_health}
      INFLUXDB_SANDBOX_BUCKET: ${INFLUXDB_SANDBOX_BUCKET:-sandbox}
      INFLUXDB_SANDBOX_RETENTION: ${INFLUXDB_SANDBOX_RETENTION:-30d}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./scripts/init-buckets.sh:/docker-entrypoint-initdb.d/init-buckets.sh:ro
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Workflow Engine (Node-RED)
  # ------------------------------------------------------------------------------------
  node-red:
    image: nodered/node-red:5.0
    container_name: p4n4-node-red
    profiles: [node-red]
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "1880:1880"
    environment:
      TZ: ${TZ:-UTC}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ming}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
      INFLUXDB_SANDBOX_BUCKET: ${INFLUXDB_SANDBOX_BUCKET:-sandbox}
      FLOWS: /data/flows/flows.json
      # Editor login (no default password: logins are refused until it is set)
      NODE_RED_USER: ${NODE_RED_USER:-admin}
      NODE_RED_PASSWORD: ${NODE_RED_PASSWORD:-}
    volumes:
      - node-red-data:/data
      - ./config/node-red/settings.js:/data/settings.js:ro
      # Mount the directory, not the file: Node-RED saves by renaming a temp file
      # over flows.json, which fails with EBUSY on a single-file bind mount.
      - ./config/node-red/flows:/data/flows
    depends_on:
      mqtt:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:1880',r=>{r.statusCode===200?process.exit(0):process.exit(1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Data Visualization (Grafana)
  # ------------------------------------------------------------------------------------
  grafana:
    # grafana/grafana is the OSS image; grafana/grafana-oss stopped at 13.0.2
    image: grafana/grafana:13.0
    container_name: p4n4-grafana
    profiles: [grafana]
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-adminpassword}
      # Lets p4n4-dashboard's web UI show Grafana in an <iframe>
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      # Path Grafana serves under: "/" (default), or "/grafana/" when
      # p4n4-dashboard proxies it on its own origin (its GRAFANA_UPSTREAM)
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s${GRAFANA_SUB_PATH:-/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Passed to provisioning templates via env var expansion
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ming}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Metrics Agent (Telegraf) — optional, not in the default profiles
  # ------------------------------------------------------------------------------------
  # Writes host metrics (CPU, memory, disk, network) and Mosquitto broker stats
  # to the system_health bucket. Sensor data still flows through Node-RED.
  telegraf:
    image: telegraf:1.40
    container_name: p4n4-telegraf
    profiles: [telegraf]
    restart: ${RESTART_POLICY:-unless-stopped}
    # Names the host in the metrics' "host" tag
    hostname: ${TELEGRAF_HOSTNAME:-p4n4}
    environment:
      TZ: ${TZ:-UTC}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ming}
      INFLUXDB_BUCKET_HEALTH: ${INFLUXDB_BUCKET_HEALTH:-system_health}
      TELEGRAF_INTERVAL: ${TELEGRAF_INTERVAL:-10s}
      # Read the host's /proc, /sys and filesystems, not the container's
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_MOUNT_PREFIX: /hostfs
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /:/hostfs:ro
    # No depends_on: Telegraf retries the broker and buffers writes until
    # InfluxDB is up, so it also runs when either is left out.
    networks:
      - p4n4-net

# ====================================================================================
# NETWORKS
# ====================================================================================
networks:
  p4n4-net:
    name: p4n4-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ====================================================================================
# VOLUMES
# ====================================================================================
volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  node-red-data:
  grafana-data:
